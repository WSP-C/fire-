# Parameters
nc: 3 # number of classes
scales: # model compound scaling constants
  n: [0.33, 0.25, 1024]

# YOLOv8n-EMA backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4  <-- P3 输出层 (序号不变)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6  <-- P4 输出层 (序号不变)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8

  - [-1, 1, EMA, [1024]]       # 9  (插入的 EMA 模块)

  - [-1, 1, SPPF, [1024, 5]]   # 10 (原为 9，受 EMA 影响变成 10)

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]  # 12 (拼接上采样后的特征与 Backbone 第 6 层 P4，改回 6)
  - [-1, 3, C2f, [512]]        # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]  # 15 (拼接上采样后的特征与 Backbone 第 4 层 P3，改回 4)
  - [-1, 3, C2f, [256]]        # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 (拼接 Head 内部的 13 层，序号正确)
  - [-1, 3, C2f, [512]]        # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 (拼接 Backbone 最后的 SPPF，由于 EMA，它变成了 10)
  - [-1, 3, C2f, [1024]]       # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)